<!DOCTYPE html>
<html lang="en">
<head>
<title>Math Scentia</title>
<meta charset="UTF-8">
    <meta name="description" content="Math success for elementary school. Help with addition, subtraction, multiplication, and division.">
    <meta name="keywords" content="Math, help, practice, addition, subtraction, multiplication, division">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="John Welsh">
	<link rel="stylesheet" type="text/css" href="math.css">
	
<script src="addition.js" defer></script>
<script src="subtraction.js" defer></script>
<script src="multiplication.js" defer></script>
<script src="division.js" defer></script>
</head>
<body>

<main>
  <img src="math.png" class="hero-image" alt="Math Scentia">
  <h1>Practice | Grow | Succeed</h1>
</main>

<div class="buttons-wrapper">
    <div class="math-box addition">
        <div class="math-symbol">+</div>
        <h2>Addition</h2>
        <button class="operation-button" id="addition">
            Get Started
        </button>
    </div>

    <div class="math-box subtraction">
        <div class="math-symbol">−</div>
        <h2>Subtraction</h2>
        <button class="operation-button" id="subtraction">
            Get Started
        </button>
    </div>

    <div class="math-box multiplication">
        <div class="math-symbol">×</div>
        <h2>Multiplication</h2>
        <button class="operation-button" id="multiplication">
            Get Started
        </button>
    </div>

    <div class="math-box division">
        <div class="math-symbol">÷</div>
        <h2>Division</h2>
        <button class="operation-button" id="division">
            Get Started
        </button>
    </div>
</div>

<!-- Math Workspace -->
<section id="math-workspace" class="hidden">
    <h2 id="workspace-title"></h2>
    <div id="workspace-content">
    </div>
</section>

<div class="copyright">

</div>

</body>
</html>
